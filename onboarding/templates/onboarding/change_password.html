
<!DOCTYPE html>
{% load static %}
<html>
<head>
    <title>Change Password</title>

    <style>

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #111827;
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .top-bar .left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            height: 35px;
            width: 35px;
            object-fit: contain;
        }

        .portal-name {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            padding-top: 60px;

            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #111827, #1e3a8a);
        }

        .container {
            background: #fff;
            padding: 35px;
            width: 380px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #111827;
        }

        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        label {
            font-weight: 600;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            outline: none;
        }

        input:focus {
            border-color: #1e3a8a;
            box-shadow: 0 0 6px rgba(30,58,138,0.3);
        }

        button {
            width: 100%;
            padding: 11px;
            margin-top: 20px;
            background: #1e3a8a;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }

        .error {
            color: red;
            margin-top: 10px;
            font-size: 14px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px ;
        }

        .top-bar .right {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-left: auto;
            margin-right: 40px;
        }

        .nav-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 6px;
            transition: 0.3s;
        }

        .username {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 6px;
            transition: 0.3s;
        }

        .nav-link:hover {
            background: #1e3a8a;
        }

        .nav-user {
            color: #fff;
            margin-right: 15px;
            font-weight: 500;
        }

    </style>
</head>

<body>
<div class="top-bar">
    <div class="left">
        <img src="{% static 'onboarding/img.png' %}" class="logo">
        <span class="portal-name">Onboarding Portal</span>
    </div>

    <div class="right">
         <span class="username">
            😊 {{ candidate.username }}
        </span>
        <a href="{% url 'onboarding_form' token=token %}" class="nav-link"> ⬅ Back to Onboarding </a>

    </div>
</div>

<div class="container">
    <h2>Change Password</h2>

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label>Old Password</label>
            <input type="password" name="old_password" required>
        </div>

        <div class="form-group">
            <label>New Password</label>
            <input type="password" name="new_password1" required>
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" name="new_password2" required>
        </div>

        <button type="submit">Update Password</button>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
    </form>
</div>

</body>
</html>

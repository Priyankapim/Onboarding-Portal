{% extends 'onboarding/base.html' %}

{% block content %}

<h2>Step 4: Documents</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    {{ formset.management_form }}

    <!-- 🔽 Document Container -->
    <div id="doc-container">

        {% for form in formset %}
            <div class="form-row">
                {{ form.as_p }}

                <!-- hidden delete -->
                {{ form.DELETE }}

                <!-- delete button -->
                <button type="button"
                        class="btn-delete"
                        onclick="deleteRow(this,'form')" >
                    Delete
                </button>
            </div>
        {% endfor %}

    </div>

    <!-- ➕ Add Document -->
    <button type="button"
            class="btn-add"
            onclick="addRow('doc-container','form','{{ formset.empty_form.as_p|escapejs }}')" >
        + Add Document
    </button>

    <br><br>

    <!-- 🔘 Navigation -->
    <button type="submit" name="prev">← Previous</button>
    <button type="submit" name="next">Submit</button>

</form>

{% endblock %}

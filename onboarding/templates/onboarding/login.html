<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

<h2>Welcome {{ candidate.first_name }}</h2>

<form method="post">
    {% csrf_token %}

    <label>User ID:</label>
    <input type="text" name="username" required>

    <label>Password:</label>
    <input type="password" name="password" required>

    <button type="submit">Login</button>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}
</form>

</body>
</html>
